name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste tokens, client secrets or private message content.**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact command you ran (redact space IDs if needed).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: The JSON error printed on stderr, and the output of `gchat --debug ...` if relevant.
      render: shell
  - type: input
    id: version
    attributes:
      label: gchat version
      placeholder: "gchat --version"
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Python version
      placeholder: "Ubuntu 24.04, Python 3.12"
