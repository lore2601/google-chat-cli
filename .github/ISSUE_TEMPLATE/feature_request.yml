name: Feature request
description: Suggest a new command or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you (or your agent) trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed command / behaviour
      description: Example invocation and expected JSON output.
  - type: textarea
    id: api
    attributes:
      label: Google Chat API method(s)
      description: Link to the relevant method in the Chat API reference, if known.
