[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "google-chat-cli"
dynamic = ["version"]
description = "An agent-friendly command-line interface for Google Chat (unofficial)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Lorenzo Magnanelli" }]
keywords = ["google-chat", "cli", "agents", "llm", "google-workspace", "claude-code"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Chat",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1",
  "google-auth>=2.29",
  "google-auth-oauthlib>=1.2",
  "requests>=2.31",
]

[project.optional-dependencies]
keyring = ["keyring>=25"]

[project.scripts]
gchat = "gchat_cli.__main__:main"

[project.urls]
Homepage = "https://github.com/lore2601/google-chat-cli"
Documentation = "https://github.com/lore2601/google-chat-cli#readme"
Issues = "https://github.com/lore2601/google-chat-cli/issues"
Changelog = "https://github.com/lore2601/google-chat-cli/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "responses>=0.25",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-requests>=2.31",
]

[tool.hatch.version]
path = "src/gchat_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gchat_cli"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "skills", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "RUF", "C4", "PT", "RET"]
ignore = ["S101", "RET504"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["google.*", "google_auth_oauthlib.*", "keyring.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# google-auth ships without complete type hints.
module = ["gchat_cli.auth", "gchat_cli.context"]
disallow_untyped_calls = false
warn_return_any = false

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["integration: hits the real Google Chat API (needs credentials)"]

[tool.coverage.run]
source = ["gchat_cli"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
